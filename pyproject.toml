[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Evaluation harness for structured LLM outputs: stratified anonymized datasets, pure-Python metrics with confidence intervals, fail-closed LLM-as-judge faithfulness, per-record results and baseline regression gates."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dmytro Vashchenko" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]
keywords = ["llm", "evaluation", "evals", "llm-as-judge", "call-analytics", "anonymization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/dimonchik03/llm-eval-harness"

[project.scripts]
llm-eval = "eval_harness.cli:main"

[project.optional-dependencies]
# The default faithfulness judge speaks to OpenAI structured outputs.
judge = ["openai>=1.60"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
packages = ["eval_harness"]

[tool.setuptools.package-data]
eval_harness = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "G", "RUF"]
# Cyrillic text and typographic dashes in strings and comments are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["eval_harness"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
